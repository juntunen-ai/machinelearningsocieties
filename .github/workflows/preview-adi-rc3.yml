name: Preview adi-rc3

on:
  push:
    branches: [preview/adi-rc3]

permissions:
  contents: read
  checks: write

jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT || secrets.MACHINE_LEARNING_SOCIETIES }}
    steps:
      - name: Check secret
        id: check
        run: |
          if [ -z "$FIREBASE_SA" ]; then
            echo "::error::No FIREBASE_SERVICE_ACCOUNT or MACHINE_LEARNING_SOCIETIES secret set; cannot deploy preview."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Deploy preview channel adi-rc3
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT || secrets.MACHINE_LEARNING_SOCIETIES }}
          channelId: adi-rc3
          expires: 7d
          projectId: machine-learning-societies
