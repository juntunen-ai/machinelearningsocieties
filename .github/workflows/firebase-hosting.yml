name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - background.md
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT || secrets.MACHINE_LEARNING_SOCIETIES }}
    steps:
      - name: Check secret
        id: check
        run: |
          if [ -z "$FIREBASE_SA" ]; then
            echo "::warning::No FIREBASE_SERVICE_ACCOUNT or MACHINE_LEARNING_SOCIETIES secret set; skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'
      - name: Prepare credentials
        if: steps.check.outputs.ready == 'true'
        run: |
          # Support either raw JSON or base64-encoded service account JSON
          if printf '%s' "$FIREBASE_SA" | jq -e . >/dev/null 2>&1; then
            printf '%s' "$FIREBASE_SA" > "$RUNNER_TEMP/sa.json"
          else
            printf '%s' "$FIREBASE_SA" | base64 -d > "$RUNNER_TEMP/sa.json"
          fi
      - name: Deploy to Firebase Hosting
        if: steps.check.outputs.ready == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT || secrets.MACHINE_LEARNING_SOCIETIES }}
          channelId: live
          projectId: machine-learning-societies
