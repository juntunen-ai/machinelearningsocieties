name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT || secrets.MACHINE_LEARNING_SOCIETIES }}
    steps:
      - name: Check secret
        id: check
        run: |
          if [ -z "$FIREBASE_SA" ]; then
            echo "No service account secret set; skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'
      - uses: FirebaseExtended/action-hosting-deploy@v0
        if: steps.check.outputs.ready == 'true'
        with:
          repoToken: ${{ github.token }}
          firebaseServiceAccount: ${{ env.FIREBASE_SA }}
          projectId: machine-learning-societies
          channelId: live
